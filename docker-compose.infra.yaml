# ============================================================
# Infra services: Nginx Proxy Manager + Dockhand + Authentik
# Guacamole is optional (disabled by default; enable via profile)
# Usage:
#   docker compose -f docker-compose.dlh.yaml -f docker-compose.infra.yaml up -d
#   docker compose -f docker-compose.dlh.yaml -f docker-compose.infra.yaml --profile guacamole up -d
# ============================================================

x-dlh-runtime: &dlh-runtime
  networks:
    - web_network
  restart: always
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-dlh-timezone: &dlh-timezone
  TZ: ${TZ:-Asia/Ho_Chi_Minh}

x-authentik-env: &authentik-env
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-this-authentik-secret-key}
  AUTHENTIK_ERROR_REPORTING_ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST:-dlh-postgres}
  AUTHENTIK_POSTGRESQL__PORT: 5432
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-${POSTGRES_DB:-postgres}}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-${POSTGRES_USER:-postgres}}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}

services:


  # ==========================================================
  # INFRA: REVERSE PROXY (Zoraxy)
  # ==========================================================
  # Zoraxy is run externally and binds to ports 80/443.


  # ==========================================================
  # INFRA: DOCKER MANAGEMENT (Dockhand)
  # ==========================================================

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dlh-dockhand
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${DLH_APP_BIND_IP:-127.0.0.1}:${DLH_DOCKHAND_PORT:-23000}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockhand:/app/data
      - /mnt/d:/mnt/d
      - /home/johndoe:/home/johndoe
    networks:
      - web_network


            
networks:
  web_network:
    external: true
    name: web_network
