<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - DataLakehouse Portal</title>
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Glassmorphism Styles -->
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glow-border:focus-within {
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-md space-y-8">
        <!-- Logo and Brand -->
        <div class="text-center">
            <div class="inline-flex bg-gradient-to-tr from-indigo-500 to-cyan-400 p-3 rounded-2xl shadow-lg shadow-indigo-500/25 mb-4">
                <i class="fa-solid fa-database text-white text-3xl"></i>
            </div>
            <h2 class="font-heading font-extrabold text-3xl bg-gradient-to-r from-indigo-200 to-cyan-300 bg-clip-text text-transparent tracking-tight">DataLakehouse Portal</h2>
            <p class="text-xs text-slate-400 mt-2 uppercase tracking-widest font-semibold">Hệ thống Tải & Phân Tích Dữ Liệu</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-3xl p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-cyan-500/5 rounded-full blur-xl"></div>

            <h3 class="font-heading font-bold text-xl text-slate-200 text-glow mb-6">Đăng nhập hệ thống</h3>

            {% if error %}
            <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold flex items-center space-x-2 animate-bounce">
                <i class="fa-solid fa-circle-exclamation text-sm"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <!-- Username Input -->
                <div class="space-y-2">
                    <label for="username" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Tên đăng nhập</label>
                    <div class="relative glow-border border border-slate-800 rounded-xl bg-slate-950/40">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" required placeholder="Nhập tài khoản" class="w-full bg-transparent pl-10 pr-4 py-3 text-sm focus:outline-none text-slate-200">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Mật khẩu</label>
                        <a href="{{ url_for('forgot_password') }}" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Quên mật khẩu?</a>
                    </div>
                    <div class="relative glow-border border border-slate-800 rounded-xl bg-slate-950/40">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu" class="w-full bg-transparent pl-10 pr-4 py-3 text-sm focus:outline-none text-slate-200">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-bold rounded-xl transition-all duration-300 shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
                    Đăng nhập
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-500">
            Tài khoản mặc định: <span class="font-bold text-slate-400">admin / admin</span>
        </p>
    </div>
</body>
</html>
