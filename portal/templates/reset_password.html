<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - DataLakehouse Portal</title>
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Glassmorphism Styles -->
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glow-border:focus-within {
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-md space-y-6">
        <div class="text-center">
            <div class="inline-flex bg-gradient-to-tr from-indigo-500 to-cyan-400 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/25 mb-3">
                <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
            </div>
            <h2 class="font-heading font-extrabold text-2xl bg-gradient-to-r from-indigo-200 to-cyan-300 bg-clip-text text-transparent">Nhập Mã Passcode</h2>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Nhập mã xác thực để đặt lại mật khẩu</p>
        </div>

        <div class="glass-card rounded-3xl p-8 relative overflow-hidden">
            {% if error %}
            <div class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-sm"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('reset_password') }}" method="POST" class="space-y-4">
                <!-- Username (Hidden or Disabled) -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Tên đăng nhập</label>
                    <input type="text" name="username" value="{{ username or '' }}" required readonly class="w-full rounded-xl border border-slate-800 bg-slate-950/80 px-3.5 py-2.5 text-sm focus:outline-none text-slate-400 cursor-not-allowed">
                </div>

                <!-- Passcode -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Mã xác thực (Passcode)</label>
                    <div class="relative glow-border border border-slate-800 rounded-xl bg-slate-950/40">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="text" name="passcode" required placeholder="Nhập mã 6 số" class="w-full bg-transparent pl-10 pr-4 py-3 text-sm focus:outline-none text-slate-200 font-mono tracking-widest">
                    </div>
                </div>

                <!-- New Password -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Mật khẩu mới</label>
                    <div class="relative glow-border border border-slate-800 rounded-xl bg-slate-950/40">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="new_password" required placeholder="Tối thiểu 5 ký tự" class="w-full bg-transparent pl-10 pr-4 py-3 text-sm focus:outline-none text-slate-200">
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Xác nhận mật khẩu</label>
                    <div class="relative glow-border border border-slate-800 rounded-xl bg-slate-950/40">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-circle-check"></i>
                        </span>
                        <input type="password" name="confirm_password" required placeholder="Xác nhận mật khẩu mới" class="w-full bg-transparent pl-10 pr-4 py-3 text-sm focus:outline-none text-slate-200">
                    </div>
                </div>

                <!-- Submit and Back -->
                <div class="flex items-center space-x-3 pt-3">
                    <a href="{{ url_for('forgot_password') }}" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all duration-300 text-center text-sm">
                        Quay lại
                    </a>
                    <button type="submit" class="flex-1 py-3 px-4 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-bold rounded-xl transition-all duration-300 shadow-lg active:scale-[0.98] text-sm">
                        Đặt lại mật khẩu
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
