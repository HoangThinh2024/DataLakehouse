input:
  kafka:
    addresses: ["redpanda:9092"]
    topics: ["dbserver2.public.demo"]
    consumer_group: "benthos-cdc-ingest"

pipeline:
  processors:
    - mapping: |
        # Handle both wrapped (with schema) and unwrapped Debezium JSON
        let msg = if this.payload != null { this.payload } else { this }
        
        # Extract the 'after' state
        root = $msg.after
        
        # Fill metadata
        if root != null {
          root._pipeline_run_id = "cdc-debezium-stream"
          root._source_table = "PostgreSQL.public.demo"
          
          # 1. Convert Debezium order_date (days since epoch) to YYYY-MM-DD
          if root.order_date.type() == "number" {
             root.order_date = (root.order_date * 86400).format_timestamp("2006-01-02")
          }
          
          # 2. Fix created_at format for ClickHouse (more robust replacement)
          if root.created_at != null {
             # Debezium format: "2026-04-22T02:55:24.669131Z"
             # ClickHouse format: "2026-04-22 02:55:24"
             root.created_at = root.created_at.string().replace("T", " ").re_replace("Z$", "")
          }
        }
        
        # Filter out deletes/nulls
        root = if root == null { deleted() }

output:
  retry:
    max_retries: 3
    output:
      sql_insert:
        driver: "clickhouse"
        dsn: "clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@${CLICKHOUSE_HOST:-dlh-clickhouse}:9000/${CLICKHOUSE_DB:-analytics}"
        table: "analytics.silver_demo"
        columns: [id, name, category, value, quantity, order_date, region, status, customer_email, notes, created_at, _pipeline_run_id, _source_table]
        args_mapping: |
          root = [
            this.id.number(), 
            this.name, 
            this.category, 
            this.value.number(), 
            this.quantity.number(), 
            this.order_date, 
            this.region, 
            this.status, 
            this.customer_email, 
            this.notes, 
            this.created_at, 
            this._pipeline_run_id, 
            this._source_table
          ]
